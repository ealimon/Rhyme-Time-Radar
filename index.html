<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhyme Time Radar: Master Edition</title>
    <style>
        :root {
            --lvl1-color: #00ff41; --lvl2-color: #00d4ff; --lvl3-color: #f59e0b;
            --radar-accent: var(--lvl1-color);
            --bg-black: #050505; --panel: #111;
        }
        body {
            background-color: var(--bg-black); color: var(--radar-accent);
            font-family: 'Courier New', monospace; margin: 0; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        .radar-container {
            width: 450px; height: 450px; border: 4px solid var(--radar-accent);
            border-radius: 50%; position: relative; background: radial-gradient(circle, #001100 0%, #000 80%);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.1); transition: border-color 0.8s;
        }
        .sweep {
            width: 50%; height: 50%; position: absolute; top: 0; left: 0;
            background: linear-gradient(45deg, rgba(0,255,65,0.3) 0%, transparent 70%);
            transform-origin: bottom right; animation: rotate 4s linear infinite;
            border-right: 2px solid var(--radar-accent); z-index: 1;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .target-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--bg-black); border: 2px solid var(--radar-accent);
            padding: 15px; z-index: 10; text-align: center; min-width: 80px;
        }
        .signal {
            position: absolute; padding: 10px 18px; border: 1px solid var(--radar-accent);
            background: rgba(0, 20, 0, 0.9); cursor: pointer; font-weight: bold;
            z-index: 5; transition: transform 0.2s, opacity 0.5s;
        }
        .signal:hover { background: var(--radar-accent); color: #000; transform: scale(1.1); }
        
        .hud { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; }
        .rank-tag { font-size: 0.8rem; letter-spacing: 4px; margin-bottom: 5px; }
        .msg { height: 40px; margin-top: 20px; font-size: 1.2rem; font-weight: bold; }
        
        #final-screen { display: none; text-align: center; }
        .btn-next { 
            display: none; padding: 15px 30px; background: var(--radar-accent); 
            color: #000; border: none; font-weight: bold; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="hud">
        <div id="rank" class="rank-tag">RANK: RADAR TECHNICIAN</div>
        <h1 id="sector-title">SECTOR 1: CVC SHORT VOWELS</h1>
    </div>

    <div class="radar-container" id="radar">
        <div class="sweep" id="sweep-line"></div>
        <div class="target-center">
            <div style="font-size: 0.7rem; color: #666;">TARGET</div>
            <div id="target-word" style="font-size: 1.6rem;">CAT</div>
        </div>
    </div>

    <div id="status" class="msg"></div>
    <button id="nextBtn" class="btn-next" onclick="handleNext()">NEXT SECTOR ➔</button>

    <div id="final-screen">
        <h1 style="font-size: 3rem;">🏆 MISSION COMPLETE</h1>
        <h2>Rank Attained: Galaxy Navigator</h2>
        <p>All rhyming signals identified and secured.</p>
        <button onclick="location.reload()" class="btn-next" style="display:inline-block">RESTART RADAR</button>
    </div>

<script>
    // --- AUDIO ENGINE ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(freq, type, dur) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    // --- MISSION DATA ---
    const levels = [
        {
            name: "SECTOR 1: CVC SHORT VOWELS", rank: "RANK: RADAR TECHNICIAN", color: "#00ff41",
            missions: [
                { t: "CAT", r: ["BAT", "HAT", "MAT"], d: ["DOG", "SUN", "PIN"] },
                { t: "PIN", r: ["FIN", "WIN", "TIN"], d: ["BOX", "NET", "MAP"] }
            ]
        },
        {
            name: "SECTOR 2: LONG VOWELS & SILENT E", rank: "RANK: SIGNAL COMMANDER", color: "#00d4ff",
            missions: [
                { t: "CAKE", r: ["LAKE", "BAKE", "RAKE"], d: ["BACK", "COOK", "TAKE"] },
                { t: "BONE", r: ["CONE", "ZONE", "TONE"], d: ["DONE", "BOON", "BENT"] }
            ]
        },
        {
            name: "SECTOR 3: BLENDS & DIGRAPHS", rank: "RANK: GALAXY NAVIGATOR", color: "#f59e0b",
            missions: [
                { t: "TRUCK", r: ["STUCK", "LUCK", "DUCK"], d: ["TRACK", "TRICK", "TANK"] },
                { t: "BRIGHT", r: ["LIGHT", "NIGHT", "SIGHT"], d: ["BRING", "BLAST", "BIT"] }
            ]
        }
    ];

    let curLvl = 0, curMiss = 0, found = 0;

    function initRadar() {
        const lvl = levels[curLvl];
        const data = lvl.missions[curMiss];
        document.documentElement.style.setProperty('--radar-accent', lvl.color);
        document.getElementById('rank').innerText = lvl.rank;
        document.getElementById('sector-title').innerText = lvl.name;
        document.getElementById('target-word').innerText = data.t;
        document.getElementById('nextBtn').style.display = 'none';
        
        found = 0;
        document.querySelectorAll('.signal').forEach(s => s.remove());

        const words = [...data.r.map(w => ({w, isR:true})), ...data.d.map(w => ({w, isR:false}))];
        words.sort(() => Math.random() - 0.5).forEach((item, i) => {
            const s = document.createElement('div');
            s.className = 'signal'; s.innerText = item.w;
            const angle = (i / words.length) * Math.PI * 2;
            const dist = 130 + Math.random() * 60;
            s.style.left = `${225 + Math.cos(angle) * dist - 30}px`;
            s.style.top = `${225 + Math.sin(angle) * dist - 20}px`;

            s.onclick = () => {
                if(item.isR) {
                    playSfx(880, 'sine', 0.5); found++;
                    s.style.opacity = "0"; s.style.pointerEvents = "none";
                    document.getElementById('status').innerText = "🎯 SIGNAL ACQUIRED";
                    if(found === data.r.length) showNextBtn();
                } else {
                    playSfx(120, 'sawtooth', 0.3);
                    document.getElementById('status').innerText = "⚠️ NOISE DETECTED";
                }
            };
            document.getElementById('radar').appendChild(s);
        });
    }

    function showNextBtn() {
        document.getElementById('status').innerText = "SECTOR SCAN COMPLETE";
        document.getElementById('nextBtn').style.display = 'inline-block';
    }

    function handleNext() {
        curMiss++;
        if(curMiss >= levels[curLvl].missions.length) {
            curLvl++; curMiss = 0;
        }
        if(curLvl >= levels.length) {
            document.body.innerHTML = document.getElementById('final-screen').innerHTML;
        } else {
            document.getElementById('status').innerText = "";
            initRadar();
        }
    }

    window.addEventListener('mousedown', () => { if(audioCtx.state === 'suspended') audioCtx.resume(); });
    initRadar();
</script>
</body>
</html>
